name: Publish node-ci

on:
  push:
    branches:
      - main
    paths:
      - images/node-ci/Dockerfile
      - images/node-ci/Aptfile
      - .github/workflows/publish-node-ci.yml
  pull_request:
    paths:
      - images/node-ci/Dockerfile
      - images/node-ci/Aptfile
      - .github/workflows/publish-node-ci.yml
  workflow_dispatch:

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: node-ci
            target: ci
          - image: node-ci-chromium
            target: chromium
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect image version
        id: version
        run: |
          version=$(sed -n 's/^FROM node:\([^-@]*\).*$/\1/p' images/node-ci/Dockerfile)
          if [ -z "$version" ]; then
            echo "Unable to detect node-ci version from images/node-ci/Dockerfile" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish on main
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: images/node-ci/Dockerfile
          platforms: linux/amd64
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
